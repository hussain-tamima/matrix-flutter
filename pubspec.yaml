name: element_x
description: Element X — a Matrix client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  go_router: ^18.0.0
  dio: ^5.9.2
  get_it: ^9.2.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  easy_localization: ^3.0.8
  google_fonts: ^8.2.1
  intl: ^0.20.2
  matrix: ^13.0.0
  sqflite_common_ffi: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.4
  vodozemac: ^0.8.0
  flutter_vodozemac: ^0.8.1
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  geolocator: ^14.1.1
  record: ^7.1.1
  flutter_webrtc: ^1.6.2+hotfix.3
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  livekit_client: ^2.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/logos/rop-logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/translations/en.json
    - assets/translations/ar.json
    - assets/images/logos/
    - assets/images/backgrounds/
